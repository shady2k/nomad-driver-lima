# The box base image, built on a runner with KVM and published as release
# assets, plus the index.json that `box images` reads: point BOX_IMAGE_INDEX at
#
#   https://github.com/<owner>/<repo>/releases/download/<tag>/index.json
#
# Triggers: a published release (the tag names the version: v1.2.3 builds image
# 1.2.3) and a manual run with a version. A release that release.yml creates does
# not fire the release trigger -- a workflow's own token starts no run -- so
# release.yml asks for this workflow by name at its end, and a release published
# by hand fires it directly.
#
# amd64 only. An arm64 image needs an arm64 host with KVM; GitHub's arm64 hosted
# runners do not expose /dev/kvm, so an arm64 image stays a local build, on an
# arm64 machine or emulated on x86_64:
#
#   images/build.sh arm64 <version>
#   IMAGE_PATH=out/box-base-<version>-arm64.qcow2 OUT=out images/verify.sh arm64 <version>
#
# (an emulated build needs a limactl that carries the aarch64 guest agent, see
# the LIMACTL note in images/build.sh).
#
# An asset is never overwritten: the job refuses a version that is already
# published, and gh refuses an asset name that exists.
name: Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: image version to build, for example 1.0.3
        required: true
        type: string
      release_tag:
        description: release that receives the assets (default v<version>)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: image-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

env:
  LIMA_VERSION: "2.2.0"
  LIMA_SHA256: a0ea1ccf6b7335a900adb5f8d2b8384457965fecb1ba72f09b4e3e46d12f424a

jobs:
  amd64:
    name: amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # One place decides the image version and the release it goes to: the
      # manual input, or the tag of the release that triggered the run.
      - name: Resolve the version and the release
        id: image
        run: |
          version="${{ inputs.version }}"
          tag="${{ inputs.release_tag }}"
          if [[ -z $version ]]; then
            tag="${{ github.event.release.tag_name }}"
            version="${tag#v}"
          fi
          if [[ -z $tag ]]; then
            tag="v$version"
          fi
          [[ -n $version ]] || { echo "no image version" >&2; exit 1; }
          printf 'version=%s\ntag=%s\n' "$version" "$tag" >> "$GITHUB_OUTPUT"
          echo "building image $version, uploaded to release $tag"

      # The build takes half an hour; fail in the first minute if the version is
      # published already or the release it names does not exist.
      - name: The version and the release may take this image
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.image.outputs.version }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null || {
            echo "release $TAG does not exist: publish the tag first (release.yml creates the release)" >&2
            exit 1
          }
          name="box-base-$VERSION-amd64.qcow2"
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$name"; then
            echo "$TAG already publishes $name; a published image is immutable, build a new version" >&2
            exit 1
          fi

      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      # GitHub's documented way to give an unprivileged user /dev/kvm.
      - name: Enable /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils

      - name: Install lima ${{ env.LIMA_VERSION }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/lima.tgz" \
            "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/lima-${LIMA_VERSION}-Linux-x86_64.tar.gz"
          echo "${LIMA_SHA256}  $RUNNER_TEMP/lima.tgz" | sha256sum -c -
          sudo tar -C /usr/local -xzf "$RUNNER_TEMP/lima.tgz"
          limactl --version

      # The recipe's own defaults are used (upstream Ubuntu and the pinned tool
      # versions in images/build.sh and images/provision.sh); no mirror is set
      # here, and the workflow holds no secret of anyone's infrastructure.
      - name: Build the image
        env:
          VERSION: ${{ steps.image.outputs.version }}
          OUT: ${{ github.workspace }}/out
          WORK: ${{ runner.temp }}/images-work
        timeout-minutes: 60
        run: images/build.sh amd64 "$VERSION"

      - name: Boot the image and check the guest
        env:
          VERSION: ${{ steps.image.outputs.version }}
          OUT: ${{ github.workspace }}/out
          IMAGE_PATH: ${{ github.workspace }}/out/box-base-${{ steps.image.outputs.version }}-amd64.qcow2
          WORK: ${{ runner.temp }}/images-work
        timeout-minutes: 30
        run: images/verify.sh amd64 "$VERSION"

      - name: GitHub takes an asset below 2 GiB
        run: |
          ls -l out
          count=0
          while read -r size file; do
            count=$((count + 1))
            echo "$file: $size bytes"
            if (( size >= 2147483648 )); then
              echo "$file is $size bytes; a release asset must stay below 2 GiB" >&2
              exit 1
            fi
          done < <(find out -maxdepth 1 -name 'box-base-*' -printf '%s %p\n')
          if (( count == 0 )); then
            echo "no box-base-* artifacts in out/: the build wrote nothing" >&2
            exit 1
          fi

      # The index accumulates: start from the newest release that has one, so
      # BOX_IMAGE_INDEX never loses a version that was published before.
      - name: Find the index of the previous release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/prev"
          for tag in $(gh release list --limit 50 --json tagName,isDraft \
                         --jq '.[] | select(.isDraft | not) | .tagName'); do
            if gh release download "$tag" -p index.json -D "$RUNNER_TEMP/prev" 2>/dev/null; then
              echo "index of $tag found"
              echo "index=$RUNNER_TEMP/prev/index.json" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "no earlier index.json: this release starts the index"

      - name: Merge this image into index.json
        env:
          VERSION: ${{ steps.image.outputs.version }}
          TAG: ${{ steps.image.outputs.tag }}
          INDEX: ${{ steps.previous.outputs.index }}
        run: |
          args=(
            --version "$VERSION"
            --arch amd64
            --manifest "out/box-base-$VERSION-amd64.json"
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
            --out "$RUNNER_TEMP/index.json"
          )
          if [[ -n $INDEX ]]; then
            args+=(--index "$INDEX")
          fi
          python3 .github/scripts/box-image-index.py "${args[@]}"
          cat "$RUNNER_TEMP/index.json"

      - name: Upload the assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.image.outputs.version }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            "out/box-base-$VERSION-amd64.qcow2" \
            "out/box-base-$VERSION-amd64.qcow2.sha256" \
            "out/box-base-$VERSION-amd64.json" \
            "$RUNNER_TEMP/index.json"

      - name: Say where the index is
        env:
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          {
            echo "### Image ${{ steps.image.outputs.version }} (amd64)"
            echo
            echo "BOX_IMAGE_INDEX=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/index.json"
          } >> "$GITHUB_STEP_SUMMARY"
