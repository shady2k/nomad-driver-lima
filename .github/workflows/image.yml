# The guest image and the platform bundle it expects: the recipe in images/
# builds an amd64 image, images/platform.sh builds the bundle for the same
# architecture on this host (no VM: the executors are fetched as their own
# tarballs), and images/verify.sh boots the image with that bundle mounted
# read-only at /opt/box and runs its checks. arm64 is not built here: the GitHub
# arm64 runners have no /dev/kvm, and an emulated build takes hours to prove what
# the amd64 one already proves. An arm64 bundle builds on this host with
# images/platform.sh --arch arm64; an arm64 image is built by the operator on an
# arm64 host (images/build.sh arm64 <version>).
#
# This repository publishes no image and no bundle. Nothing here uploads to a
# release, writes an index, or contacts a store: they are the operator's, built
# with images/build.sh and images/platform.sh and published with
# images/publish.sh to their own store. What a run of this workflow proves is that
# the tree builds an image and a bundle that boot together and pass
# images/guest-checks.sh.
#
# Runs on pull requests that touch the recipe, the guest tools boxd is installed
# with, or boxd itself, and on demand with a version and a boxd source.
name: Image

on:
  pull_request:
    paths:
      - "images/**"
      - "guest/**"
      - "cmd/boxd/**"
      - "internal/boxd/**"
  workflow_dispatch:
    inputs:
      version:
        description: image version to build, for example 1.0.3
        required: true
        type: string
      boxd_source:
        description: where boxd comes from (head = the checked-out commit)
        required: false
        default: head
        type: choice
        options: [head, release, commit]
      boxd_ref:
        description: the release tag (vX.Y.Z) or the commit, when boxd_source is not head
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # One run per image version: a second version builds alongside, and only a
  # newer push to the same pull request replaces a run in progress.
  group: image-${{ inputs.version || github.event.release.tag_name || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned, with the digest from the project's own SHA256SUMS.
  LIMA_VERSION: "2.2.0"

jobs:
  image:
    name: ${{ matrix.arch }} image
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
            lima_arch: x86_64
            lima_sha256: a0ea1ccf6b7335a900adb5f8d2b8384457965fecb1ba72f09b4e3e46d12f424a
            # --no-install-recommends drops the firmware, so it is named.
            qemu_packages: qemu-system-x86 qemu-utils ovmf
    steps:
      # Full history: a BOXD_COMMIT build and the version stamp both read git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # One place decides what is built: the manual inputs, or the defaults of a
      # pull request run (this commit's boxd, version 0.0.0-ci).
      - name: Resolve the version and the boxd source
        id: image
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE: ${{ inputs.boxd_source }}
          INPUT_REF: ${{ inputs.boxd_ref }}
        run: |
          version=${INPUT_VERSION:-0.0.0-ci}
          source=${INPUT_SOURCE:-head}
          ref=${INPUT_REF:-}
          [[ $version =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]] || {
            echo "version '$version' is not a safe image version" >&2; exit 1; }
          case $source in
            head) ;;
            release)
              [[ $ref == v* ]] || { echo "boxd_source=release needs boxd_ref=vX.Y.Z" >&2; exit 1; }
              ;;
            commit)
              [[ -n $ref ]] || { echo "boxd_source=commit needs boxd_ref=<sha or ref>" >&2; exit 1; }
              ;;
            *) echo "boxd_source must be head, release or commit" >&2; exit 1 ;;
          esac
          {
            printf 'version=%s\n' "$version"
            printf 'source=%s\n' "$source"
            printf 'ref=%s\n' "$ref"
          } >> "$GITHUB_OUTPUT"
          echo "building image $version (${{ matrix.arch }}) with boxd from $source ${ref}"

      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          df -h /
          # A box disk is 8 GiB and the driver refuses a node with less free:
          # say so here rather than as a capacity error deep in a test.
          free_mib=$(df -m --output=avail / | tail -1 | tr -d ' ')
          if (( free_mib < 12288 )); then
            echo "::error::only ${free_mib} MiB free on / after the cleanup; the run needs 12 GiB"
            exit 1
          fi

      # GitHub's documented way to give an unprivileged user /dev/kvm.
      - name: Enable /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # --no-install-recommends drops the firmware, so the matrix names it.
      - name: Install qemu and its firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.qemu_packages }}
          qemu-img --version | head -1

      - name: Install lima ${{ env.LIMA_VERSION }}
        env:
          LIMA_SHA256: ${{ matrix.lima_sha256 }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/lima.tgz" \
            "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/lima-${LIMA_VERSION}-Linux-${{ matrix.lima_arch }}.tar.gz"
          echo "${LIMA_SHA256}  $RUNNER_TEMP/lima.tgz" | sha256sum -c -
          sudo tar -C /usr/local -xzf "$RUNNER_TEMP/lima.tgz"
          limactl --version

      # Short work directories: lima puts a socket at <lima home>/<instance>/serial
      # paths and refuses a long one, so nothing under $GITHUB_WORKSPACE is used
      # for the build.
      - name: Build the platform bundle
        env:
          VERSION: ${{ steps.image.outputs.version }}
          SOURCE: ${{ steps.image.outputs.source }}
          REF: ${{ steps.image.outputs.ref }}
          ARCH: ${{ matrix.arch }}
        timeout-minutes: 20
        run: |
          sudo mkdir -p /tmp/im && sudo chown "$(id -u):$(id -g)" /tmp/im
          case $SOURCE in
            release) export BOXD_RELEASE="$REF" ;;
            commit) export BOXD_COMMIT="$REF" ;;
            head) ;;
          esac
          # The bundle carries the boxd of this run: the same source the image's
          # stub unit is printed from. Nothing is published; no mirror is set
          # here, so the executors come from the public upstreams images/pins.sh
          # pins.
          images/boxd-source.sh "$ARCH" /tmp/im/boxd
          images/platform.sh --version "$VERSION" --arch "$ARCH" \
            --boxd /tmp/im/boxd/boxd --out /tmp/im/out | tee /tmp/im/out/platform.json
          ls -l /tmp/im/out

      - name: Build the image
        env:
          VERSION: ${{ steps.image.outputs.version }}
          SOURCE: ${{ steps.image.outputs.source }}
          REF: ${{ steps.image.outputs.ref }}
          ARCH: ${{ matrix.arch }}
        timeout-minutes: 60
        run: |
          case $SOURCE in
            release) export BOXD_RELEASE="$REF" ;;
            commit) export BOXD_COMMIT="$REF" ;;
            head) ;;
          esac
          # OUT and WORK are short on purpose; the recipe's defaults are in the
          # repository, and no mirror is set here: this build uses the public
          # upstreams the recipe pins.
          OUT=/tmp/im/out WORK=/tmp/im/work images/build.sh "$ARCH" "$VERSION"
          ls -l /tmp/im/out

      # The bundle built above is mounted into the verify VM the way the node
      # mounts one into a box (read-only, 9p with cache fscache), so this proves
      # the two halves together: an image that expects a bundle, and a bundle
      # that runs.
      - name: Boot the image with the bundle and run the guest checks
        env:
          VERSION: ${{ steps.image.outputs.version }}
          ARCH: ${{ matrix.arch }}
        timeout-minutes: 30
        run: |
          IMAGE_PATH=/tmp/im/out/box-base-$VERSION-$ARCH.qcow2 \
          PLATFORM_ARCHIVE=/tmp/im/out/box-platform-$VERSION-linux-$ARCH.tar.gz \
          OUT=/tmp/im/out WORK=/tmp/im/work \
            images/verify.sh "$ARCH" "$VERSION"

      # The artifact is the image, its digest and its manifest -- evidence for
      # this run, not something to publish. It expires in three days.
      - name: Collect the image, its digest and its manifest
        env:
          VERSION: ${{ steps.image.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p /tmp/im/artifact
          cp /tmp/im/out/box-base-"$VERSION"-"$ARCH".qcow2 \
             /tmp/im/out/box-base-"$VERSION"-"$ARCH".qcow2.sha256 \
             /tmp/im/out/box-base-"$VERSION"-"$ARCH".json \
             /tmp/im/out/box-base-"$VERSION"-"$ARCH".guest-checks.txt \
             /tmp/im/out/box-platform-"$VERSION"-linux-"$ARCH".tar.gz \
             /tmp/im/out/box-platform-"$VERSION"-linux-"$ARCH".tar.gz.sha256 \
             /tmp/im/out/platform.json \
             /tmp/im/artifact/
          (cd /tmp/im/artifact && sha256sum --check ./*.qcow2.sha256)
          (cd /tmp/im/artifact && sha256sum --check ./*.tar.gz.sha256)
          ls -l /tmp/im/artifact
          {
            echo "### Image $VERSION ($ARCH)"
            echo
            python3 - /tmp/im/out/box-base-"$VERSION"-"$ARCH".json /tmp/im/out/platform.json <<'PY'
          import json, sys
          image = json.load(open(sys.argv[1]))
          bundle = json.load(open(sys.argv[2]))
          unit = image.get("unit_from") or {}
          print(f"image platform field: {image.get('platform')}")
          print(f"stub unit printed by boxd: {unit.get('kind')} "
                f"{unit.get('tag') or unit.get('resolved_commit')} sha256 {str(unit.get('sha256'))[:16]}")
          print()
          print("platform bundle:")
          print(f"  version {bundle['version']} {bundle['arch']}, boxd {bundle['boxd']}, "
                f"tools {bundle['tools']}, sha256 {bundle['sha256'][:16]}..., {bundle['size']} bytes")
          PY
            echo
            echo "Nothing was published: images/publish.sh uploads to the operator's own store."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: box-image-${{ matrix.arch }}-${{ steps.image.outputs.version }}
          path: /tmp/im/artifact/*
          retention-days: 3
          if-no-files-found: error

      - name: Remove the work directory
        if: always()
        run: |
          limactl list || true
          rm -rf /tmp/im
