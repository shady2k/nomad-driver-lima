# Keep the Go modules and the pinned GitHub Actions current: a weekly pull
# request for each, and the actions keep their version comment so a pinned
# commit can be bumped to the next one.
version: 2

updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # Nomad is pinned to the pseudo-versions of the release the driver is built
    # for (its tags do not resolve as Go module versions): bump it by hand with
    # a Nomad release, not through Dependabot.
    ignore:
      - dependency-name: "github.com/hashicorp/nomad"
      - dependency-name: "github.com/hashicorp/nomad/api"
    groups:
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
