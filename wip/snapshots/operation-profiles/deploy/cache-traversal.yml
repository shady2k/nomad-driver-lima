---
- name: Reconcile only the explicitly approved catalog traversal permission
  hosts: lima_canary
  gather_facts: false
  become: true
  tasks:
    - name: Verify exact cache path and accepted artifact hashes without following symlinks
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import pathlib,stat,hashlib,json
            p=pathlib.Path('/var/lib/nomad-lima/home/_catalog-cache');s=p.lstat()
            assert stat.S_ISDIR(s.st_mode) and not p.is_symlink()
            expected={'16c71d4992233e3ee84b42de9d5901e264fbdc7a12066e11b301c739f870d41f.yaml':'16c71d4992233e3ee84b42de9d5901e264fbdc7a12066e11b301c739f870d41f','461238990eb3daee6a2d1bcfd198a2d6aa066e6abfd0b8f977dbbdbda7a0b698':'461238990eb3daee6a2d1bcfd198a2d6aa066e6abfd0b8f977dbbdbda7a0b698','94df564f566a9bf68adf9da84f97ad4aa9167dd93df9b89c99a52e03f41ceefd':'94df564f566a9bf68adf9da84f97ad4aa9167dd93df9b89c99a52e03f41ceefd'}
            allowed=set(expected)|{x+'.lock' for x in expected if not x.endswith('.yaml')}
            assert {f.name for f in p.iterdir()}==allowed
            for f in p.iterdir():
              st=f.lstat();assert stat.S_ISREG(st.st_mode) and not f.is_symlink() and st.st_uid==0
              if f.name in expected:assert hashlib.sha256(f.read_bytes()).hexdigest()==expected[f.name] and stat.S_IMODE(st.st_mode)==0o444
              else:assert st.st_size==0 and stat.S_IMODE(st.st_mode)==0o600
            print(json.dumps({'accepted_artifacts_only':True,'symlinks':False}))
      changed_when: false
    - name: Set only the approved cache directory traversal group and mode
      ansible.builtin.file:
        path: /var/lib/nomad-lima/home/_catalog-cache
        state: directory
        owner: root
        group: debian
        mode: '0710'
        recurse: false
        follow: false
    - name: Verify runtime can traverse and read but cannot list or write
      become_user: debian
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import os,pathlib,json
            p=pathlib.Path('/var/lib/nomad-lima/home/_catalog-cache')
            assert os.access(p,os.X_OK) and not os.access(p,os.R_OK) and not os.access(p,os.W_OK)
            try:list(p.iterdir());raise RuntimeError('Unexpected list permission')
            except PermissionError:pass
            f=p/'16c71d4992233e3ee84b42de9d5901e264fbdc7a12066e11b301c739f870d41f.yaml'
            assert len(f.read_bytes())==412
            print(json.dumps({'traverse':True,'known_yaml_read':True,'list':False,'write':False}))
      changed_when: false
