---
- name: Require explicit operator inputs
  ansible.builtin.assert:
    that:
      - lima_action in ['preflight', 'install']
      - lima_nomad_config_paths is defined
      - lima_nomad_config_paths | length > 0
      - lima_runtime_user is defined
      - lima_runtime_user != 'root'
      - lima_release_id is match('^[a-zA-Z0-9_.-]+$')
      - lima_binary_sha256 is match('^[a-f0-9]{64}$')
      - lima_template_sha256 is match('^[a-f0-9]{64}$')
      - lima_plugin_dir is match('^/')
      - lima_config_dir is match('^/')
      - lima_home is match('^/')
      - lima_state_dir is match('^/')
      - lima_template_dest is match('^/')
      - lima_limactl is match('^/')
      - lima_client_config_path is match('^/')
      - lima_candidate_config_path is match('^/')
      - lima_disabled_plugin_dir is match('^/')
      - lima_action != 'install' or lima_empty_node_confirmed | bool
    fail_msg: Supply reviewed external vars; see docs/deployment.md.

- name: Resolve existing runtime identity without provisioning
  ansible.builtin.getent:
    database: passwd
    key: '{{ lima_runtime_user }}'

- name: Require nonroot runtime UID
  ansible.builtin.assert:
    that:
      - ansible_facts.getent_passwd[lima_runtime_user][1] | int > 0

- name: Inspect preprovisioned directories
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
  loop:
    - '{{ lima_plugin_dir }}'
    - '{{ lima_config_dir }}'
    - '{{ lima_home }}'
    - '{{ lima_state_dir }}'
    - '{{ lima_template_dest | dirname }}'
  register: lima_directories

- name: Require directories and private Lima home ownership
  ansible.builtin.assert:
    that:
      - item.stat.isdir | default(false)
      - not item.stat.islnk | default(false)
      - item.item != lima_home or item.stat.uid == ansible_facts.getent_passwd[lima_runtime_user][1] | int
      - item.item != lima_home or item.stat.mode == '0700'
      - item.item != lima_state_dir or item.stat.uid == 0
      - item.item != lima_state_dir or item.stat.mode == '0700'
  loop: '{{ lima_directories.results }}'
  loop_control:
    label: '{{ item.item }}'

- name: Verify upstream Lima version as runtime user
  ansible.builtin.command:
    argv: ['{{ lima_limactl }}', '--version']
  become_user: '{{ lima_runtime_user }}'
  environment:
    LIMA_HOME: '{{ lima_home }}'
  register: lima_version
  changed_when: false
  check_mode: false

- name: Require exact approved upstream version
  ansible.builtin.assert:
    that: lima_version.stdout | trim == 'limactl version ' + lima_expected_version

- name: Verify Linux KVM access as existing runtime user
  ansible.builtin.command:
    argv: ['/usr/bin/test', '-r', '/dev/kvm', '-a', '-w', '/dev/kvm']
  become_user: '{{ lima_runtime_user }}'
  changed_when: false
  check_mode: false

- name: Hash controller artifacts
  ansible.builtin.stat:
    path: '{{ item }}'
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  loop: ['{{ lima_binary_src }}', '{{ lima_template_src }}']
  register: lima_sources

- name: Verify pinned input digests
  ansible.builtin.assert:
    that:
      - lima_sources.results[0].stat.checksum | default('') == lima_binary_sha256
      - lima_sources.results[1].stat.checksum | default('') == lima_template_sha256

- name: Validate and stage optional pinned repository profiles
  ansible.builtin.include_tasks: repository_profiles.yml

- name: Validate and stage optional task-scoped secret profile mappings
  ansible.builtin.include_tasks: secret_profiles.yml

- name: Stage optional operator-pinned one-off recovery inputs
  ansible.builtin.include_tasks: private_copies.yml

- name: Stage only the Lima binary and template (atomic copies with backups)
  ansible.builtin.copy:
    src: '{{ item.src }}'
    dest: '{{ item.dest }}'
    owner: root
    group: root
    mode: '{{ item.mode }}'
    backup: true
  loop:
    - {src: '{{ lima_binary_src }}', dest: '{{ lima_plugin_dir }}/nomad-driver-lima', mode: '0755'}
    - {src: '{{ lima_template_src }}', dest: '{{ lima_template_dest }}', mode: '0644'}
  when: lima_action == 'install'
  register: lima_copies

- name: Require explicit accepted catalog and retained-disk budget
  ansible.builtin.assert:
    that:
      - lima_catalog_dest is match('^/')
      - lima_catalog_sha256 is match('^[a-f0-9]{64}$')
      - lima_max_total_disk_gib | int > 0
  when: lima_catalog_src | default('') | length > 0

- name: Hash accepted controller catalog
  ansible.builtin.stat:
    path: '{{ lima_catalog_src }}'
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: lima_catalog_source
  when: lima_catalog_src | default('') | length > 0

- name: Refuse changed catalog contents
  ansible.builtin.assert:
    that: lima_catalog_source.stat.checksum == lima_catalog_sha256
  when: lima_catalog_src | default('') | length > 0

- name: Stage immutable accepted catalog with rollback backup
  ansible.builtin.copy:
    src: '{{ lima_catalog_src }}'
    dest: '{{ lima_catalog_dest }}'
    owner: root
    group: root
    mode: '0644'
    backup: true
  when: lima_action == 'install' and lima_catalog_src | default('') | length > 0

- name: Reconcile complete Lima-only client desired state
  ansible.builtin.include_tasks: lima_only.yml
  when: lima_action == 'install'

- name: Validate complete Nomad configuration without starting an agent
  ansible.builtin.command:
    argv: "{{ [lima_nomad_binary, 'config', 'validate'] + lima_nomad_config_paths }}"
  changed_when: false
  check_mode: false
  # In check mode proposed files do not exist; validate during the real staging run.
  when: lima_action == 'install' and not ansible_check_mode

- name: Report stage result and backup paths
  ansible.builtin.debug:
    msg:
      - 'No Nomad reload/restart performed. No VM or job submitted. Release: {{ lima_release_id }}'
      - 'Binary/template backups: {{ lima_copies.results | default([]) | map(attribute="backup_file", default="none") | list }}'
      - 'Config backup: {{ lima_client_copy.backup_file | default("none (unchanged)") }}'
      - 'If validation failed, restore backups/remove newly introduced files before any restart.'
