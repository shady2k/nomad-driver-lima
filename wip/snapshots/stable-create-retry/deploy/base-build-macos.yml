---
- name: Prepare an isolated native ARM64 VZ base only with verified spare resources
  hosts: lima_macos
  gather_facts: false
  become: false
  tasks:
    - name: Require operator-selected isolated paths and pinned official tools
      ansible.builtin.assert:
        that:
          - mac_build_root is match('^/')
          - mac_lima_home is match('^/')
          - mac_lima_home != mac_existing_lima_home
          - mac_builder_name is match('^agent-base-build-[a-z0-9-]+-arm64$')
          - mac_recipe_sha256 is match('^[a-f0-9]{64}$')
          - mac_limactl is match('^/')
          - mac_python is match('^/')
    - name: Read native architecture and existing runtime identity
      ansible.builtin.command: /usr/bin/uname -m
      register: mac_arch
      changed_when: false
    - name: Require native arm64 host
      ansible.builtin.assert:
        that: mac_arch.stdout | trim == 'arm64'
    - name: Read live memory pressure and target filesystem capacity without changes
      ansible.builtin.shell: |
        {{ mac_python | quote }} - <<'PY'
        import json,os,pathlib,re,subprocess
        text=subprocess.check_output(['/usr/bin/vm_stat'],text=True)
        page=int(re.search(r'page size of (\d+)',text).group(1))
        pages={k:int(v) for k,v in re.findall(r'^([^:]+):\s+(\d+)\.',text,re.M)}
        root=pathlib.Path({{ mac_build_root | to_json }})
        while not root.exists():root=root.parent
        fs=os.statvfs(root)
        pressure=int(subprocess.check_output(['/usr/sbin/sysctl','-n','kern.memorystatus_vm_pressure_level'],text=True))
        print(json.dumps({'uid':os.getuid(),'pressure':pressure,'reclaimable_mib':(pages['Pages free']+pages['Pages inactive']+pages['Pages speculative'])*page//2**20,'free_bytes':fs.f_bavail*fs.f_frsize}))
        PY
      register: mac_guard_raw
      changed_when: false
    - name: Require spare RAM and disk for builder plus two retained acceptance disks
      ansible.builtin.assert:
        that:
          - (mac_guard_raw.stdout | from_json).uid | int > 0
          - (mac_guard_raw.stdout | from_json).pressure | int == 1
          - (mac_guard_raw.stdout | from_json).reclaimable_mib | int >= 13312
          - (mac_guard_raw.stdout | from_json).free_bytes | int >= 85899345920
        fail_msg: 'Do not launch: retain live workloads; need normal pressure, 13GiB reclaimable RAM and 80GiB target free space (3x20GiB disks plus20GiB host reserve).'
    - name: Verify existing official Lima version
      ansible.builtin.command:
        argv: ['{{ mac_limactl }}', --version]
      register: mac_lima_version
      changed_when: false
    - name: Require reviewed upstream version
      ansible.builtin.assert:
        that: mac_lima_version.stdout | trim == 'limactl version 2.2.1'
    - name: Create only private builder locations as current nonroot user
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        mode: '0700'
      loop: ['{{ mac_build_root }}', '{{ mac_lima_home }}']
      when: mac_build_authorized | default(false) | bool
    - name: Stage immutable shared native recipe
      ansible.builtin.copy:
        src: ../templates/agent-base.yaml
        dest: '{{ mac_build_root }}/builder.yaml'
        mode: '0600'
        force: false
      when: mac_build_authorized | default(false) | bool
    - name: Hash selected builder recipe
      ansible.builtin.stat:
        path: '{{ mac_build_root }}/builder.yaml'
        checksum_algorithm: sha256
      register: mac_recipe
      when: mac_build_authorized | default(false) | bool
    - name: Refuse changed recipe
      ansible.builtin.assert:
        that: mac_recipe.stat.checksum == mac_recipe_sha256
      when: mac_build_authorized | default(false) | bool
    - name: Create native VZ builder through upstream Lima without host mounts or containers
      ansible.builtin.command:
        argv: [/usr/bin/env, -i, 'HOME={{ mac_user_home }}', 'PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin', 'LIMA_HOME={{ mac_lima_home }}', '{{ mac_limactl }}', create, '--tty=false', '--name={{ mac_builder_name }}', --vm-type=vz, --arch=aarch64, '{{ mac_build_root }}/builder.yaml']
        creates: '{{ mac_lima_home }}/{{ mac_builder_name }}/lima.yaml'
      when: mac_build_authorized | default(false) | bool
    - name: Check durable launch receipt
      ansible.builtin.stat:
        path: '{{ mac_build_root }}/prepare-operation.json'
      register: mac_operation
      when: mac_build_authorized | default(false) | bool
    - name: Launch one-time clean ARM64 preparation with visible upstream logs
      ansible.builtin.shell: >-
        /usr/bin/env -i HOME={{ mac_user_home | quote }} PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        LIMA_HOME={{ mac_lima_home | quote }} {{ mac_limactl | quote }} start --tty=false --progress --timeout=45m {{ mac_builder_name | quote }}
        > {{ (mac_build_root + '/builder-start.log') | quote }} 2>&1
      async: 3600
      poll: 0
      register: mac_start
      when: mac_build_authorized | default(false) | bool and not mac_operation.stat.exists
    - name: Record only creator/session and upstream operation handle
      ansible.builtin.copy:
        content: '{{ {"builder":mac_builder_name,"recipe_sha256":mac_recipe_sha256,"creator":mac_creator,"session_id":mac_session_id,"async":mac_start} | to_nice_json }}'
        dest: '{{ mac_build_root }}/prepare-operation.json'
        mode: '0600'
      when: mac_build_authorized | default(false) | bool and not mac_operation.stat.exists
