---
- name: Launch only the verified isolated official Nomad dev-agent
  hosts: lima_canary
  gather_facts: false
  become: true
  tasks:
    - name: Hash immutable reviewed driver on controller
      ansible.builtin.stat:
        path: '{{ dev_binary_src }}'
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      register: dev_binary_source
    - name: Require exact tested driver and isolated target
      ansible.builtin.assert:
        that:
          - dev_binary_source.stat.checksum == dev_binary_sha256
          - dev_root is match('^/var/lib/nomad-lima/catalog-accept-[a-z0-9-]+$')
    - name: Stage reviewed driver only in isolated discovery directory
      ansible.builtin.copy:
        src: '{{ dev_binary_src }}'
        dest: '{{ dev_root }}/plugins/nomad-driver-lima'
        owner: root
        group: root
        mode: '0755'
    - name: Create private test coordinator scripts directory
      ansible.builtin.file:
        path: '{{ dev_root }}/scripts'
        state: directory
        owner: root
        group: root
        mode: '0700'
    - name: Stage current plugin Python source for isolated end-to-end acceptance
      ansible.builtin.copy:
        src: '{{ item }}'
        dest: '{{ dev_root }}/scripts/{{ item | basename }}'
        owner: root
        group: root
        mode: '0444'
      with_fileglob: ['../plugin/scripts/*.py']
    - name: Stage synthetic no-model ACP fixture (not in published base)
      ansible.builtin.copy:
        src: ../plugin/tests/fake_agent.py
        dest: '{{ dev_root }}/fake-agent.py'
        owner: root
        group: root
        mode: '0444'
    - name: Inspect durable dev-agent launch receipt
      ansible.builtin.stat:
        path: '{{ dev_root }}/agent.pid'
      register: dev_agent_pid
    - name: Start official dev agent with empty environment and native logs
      ansible.builtin.shell: >-
        echo $$ > {{ (dev_root + '/agent.pid') | quote }};
        exec /usr/bin/env -i HOME=/root PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        {{ lima_nomad_binary | quote }} agent -dev -config={{ (dev_root + '/agent.json') | quote }}
        > {{ (dev_root + '/agent.log') | quote }} 2>&1
      async: 3600
      poll: 0
      when: not dev_agent_pid.stat.exists
      register: dev_agent_async
    - name: Report isolated operation handle
      ansible.builtin.debug:
        var: dev_agent_async.ansible_job_id
