---
- name: Update only the corrected isolated coordinator CLI
  hosts: lima_canary
  gather_facts: false
  become: true
  tasks:
    - name: Require isolated coordinator target
      ansible.builtin.assert:
        that: dev_root is match('^/var/lib/nomad-lima/catalog-accept-[a-z0-9-]+$')
    - name: Stage explicit-GET catalog CLI fix without touching agent or image
      ansible.builtin.copy:
        src: ../plugin/scripts/catalog_cli.py
        dest: '{{ dev_root }}/scripts/catalog_cli.py'
        owner: root
        group: root
        mode: '0444'
