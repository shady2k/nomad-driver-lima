---
- name: Stage immutable addressed-purge maintenance binary without plugin activation
  hosts: lima_canary
  gather_facts: false
  become: true
  tasks:
    - name: Verify tested maintenance binary at the controller
      ansible.builtin.stat:
        path: '{{ purge_binary_src }}'
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      register: purge_source
    - name: Require the explicitly tested checksum
      ansible.builtin.assert:
        that: purge_source.stat.checksum == purge_binary_sha256
    - name: Create private maintenance directory outside discovery
      ansible.builtin.file:
        path: /var/lib/nomad-lima/maintenance
        state: directory
        owner: root
        group: root
        mode: '0700'
    - name: Stage the immutable maintenance tool only
      ansible.builtin.copy:
        src: '{{ purge_binary_src }}'
        dest: '{{ purge_binary_remote }}'
        owner: root
        group: root
        mode: '0500'
    - name: Verify remote maintenance checksum
      ansible.builtin.stat:
        path: '{{ purge_binary_remote }}'
        checksum_algorithm: sha256
      register: purge_remote
    - name: Refuse binary drift before any destructive operation
      ansible.builtin.assert:
        that: purge_remote.stat.checksum == purge_binary_sha256
