---
- name: Reconcile exactly approved existing browser OAuth settings
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Require explicit scoped authorization and external target configuration
      ansible.builtin.assert:
        that:
          - storage_browser_oauth_correction_approved | default(false) | bool
          - storage_browser_oauth is mapping
          - not ansible_check_mode
    - name: Reconcile through installed official Authentik models in one transaction
      ansible.builtin.command:
        argv:
          - /opt/homebrew/bin/kubectl
          - -n
          - authentik
          - exec
          - '{{ authentik_server_pod }}'
          - --
          - ak
          - shell
          - --no-imports
          - -v
          - '0'
          - -c
          - "import json\nAPPROVED_BROWSER = json.loads({{ storage_browser_oauth | to_json | to_json }})\n{{ lookup('ansible.builtin.file', playbook_dir + '/storage-browser-authentik.py') }}"
      no_log: true
      register: browser_auth_result
      changed_when: >-
        browser_auth_result.rc == 0 and '"changed": true' in browser_auth_result.stdout
    - name: Report only approved nonsecret policy and preservation checks
      ansible.builtin.debug:
        msg: "{{ browser_auth_result.stdout_lines | select('match', '^BROWSER_RESULT:') | list }}"
