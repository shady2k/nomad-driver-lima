---
- name: Require the optional repository source and checksum together
  ansible.builtin.assert:
    that:
      - (lima_repository_profiles_src | default('') | length > 0) == (lima_repository_profiles_sha256 | default('') | length > 0)

- name: Validate and optionally stage the private pinned profile file
  when: lima_repository_profiles_src | default('') | length > 0
  block:
    - name: Require an exact private destination in the existing driver state directory
      ansible.builtin.assert:
        that:
          - lima_repository_profiles_src is match('^/')
          - lima_repository_profiles_dest is match('^/')
          - lima_repository_profiles_dest | dirname == lima_state_dir
          - not (lima_repository_profiles_dest | lower).endswith('.json')
          - lima_repository_profiles_sha256 is match('^[a-f0-9]{64}$')
    - name: Inspect the controller profile without following symlinks
      ansible.builtin.stat:
        path: '{{ lima_repository_profiles_src }}'
        follow: false
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      register: lima_repository_source
    - name: Require an unchanged private regular profile source
      ansible.builtin.assert:
        that:
          - lima_repository_source.stat.isreg | default(false)
          - not lima_repository_source.stat.islnk | default(false)
          - lima_repository_source.stat.mode | default('') == '0600'
          - lima_repository_source.stat.checksum | default('') == lima_repository_profiles_sha256
    - name: Read the declared profile privately on the controller
      ansible.builtin.slurp:
        src: '{{ lima_repository_profiles_src }}'
      delegate_to: localhost
      become: false
      register: lima_repository_content
      no_log: true
    - name: Validate the actual profile using the shipped guest schema
      ansible.builtin.set_fact:
        lima_repository_validation: '{{ lima_repository_content.content | b64decode | from_json | lima_repository_profiles }}'
      no_log: true
    - name: Inspect the destination without following symlinks
      ansible.builtin.stat:
        path: '{{ lima_repository_profiles_dest }}'
        follow: false
      register: lima_repository_destination
    - name: Reject a destination symlink or unexpected ownership
      ansible.builtin.assert:
        that:
          - not lima_repository_destination.stat.exists or (lima_repository_destination.stat.isreg | default(false) and not lima_repository_destination.stat.islnk | default(false) and lima_repository_destination.stat.uid == 0 and lima_repository_destination.stat.mode == '0600')
    - name: Install the pinned private JSON atomically with rollback backup
      ansible.builtin.copy:
        src: '{{ lima_repository_profiles_src }}'
        dest: '{{ lima_repository_profiles_dest }}'
        owner: root
        group: root
        mode: '0600'
        backup: true
      when: lima_action == 'install'
      no_log: true
      register: lima_repository_copy
    - name: Read back exact installed bytes and private ownership
      ansible.builtin.stat:
        path: '{{ lima_repository_profiles_dest }}'
        follow: false
        checksum_algorithm: sha256
      when: lima_action == 'install' and not ansible_check_mode
      register: lima_repository_installed
    - name: Require exact installed profile before emitting the driver configuration
      ansible.builtin.assert:
        that:
          - lima_repository_installed.stat.isreg
          - not lima_repository_installed.stat.islnk
          - lima_repository_installed.stat.uid == 0
          - lima_repository_installed.stat.mode == '0600'
          - lima_repository_installed.stat.checksum == lima_repository_profiles_sha256
      when: lima_action == 'install' and not ansible_check_mode
