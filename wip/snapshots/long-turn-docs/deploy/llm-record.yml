---
- name: Reconcile only the approved LLM field inside OpenBao
  hosts: openbao_admin
  gather_facts: false
  tasks:
    - name: Require exact reviewed external source and destination spec
      ansible.builtin.assert:
        that: bao_llm_spec_file is match('^/')
    - name: CAS-create the one-field record without revealing any secret values
      ansible.builtin.command:
        argv:
          - '{{ bao_admin_python }}'
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/llm-record-state.py') }}"
          - '{{ bao_llm_spec_file }}'
          - "{{ 'check' if ansible_check_mode else 'apply' }}"
      check_mode: false
      no_log: true
      register: bao_llm_result
      changed_when: bao_llm_result.stdout is defined and (bao_llm_result.stdout | from_json).changed
    - name: Report only safe record/readback metadata
      ansible.builtin.debug:
        msg: '{{ bao_llm_result.stdout | from_json }}'
