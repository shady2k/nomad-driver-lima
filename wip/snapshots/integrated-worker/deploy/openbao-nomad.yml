---
- name: Reconcile only approved neutral OpenBao Nomad trust configuration
  hosts: openbao_admin
  gather_facts: false
  tasks:
    - name: Require external operator spec and confirmed contract for apply
      ansible.builtin.assert:
        that:
          - bao_nomad_spec_file is match('^/')
          - ansible_check_mode or bao_nomad_contract_confirmed | default(false) | bool
    - name: Reconcile JWT metadata, role and narrow policy without reading business secrets
      ansible.builtin.command:
        argv:
          - '{{ bao_admin_python }}'
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/openbao-nomad-state.py') }}"
          - '{{ bao_nomad_spec_file }}'
          - "{{ 'check' if ansible_check_mode else 'apply' }}"
      check_mode: false
      no_log: true
      register: bao_nomad_result
      changed_when: bao_nomad_result.stdout is defined and (bao_nomad_result.stdout | from_json).changed
    - name: Report nonsecret trust configuration readback
      ansible.builtin.debug:
        msg: '{{ bao_nomad_result.stdout | from_json }}'
