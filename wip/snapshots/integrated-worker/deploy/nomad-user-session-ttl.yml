---
- name: Reconcile only approved user OIDC token lifetime
  hosts: nomad_operator
  gather_facts: false
  tasks:
    - name: Require confirmed adequate server bound before scoped method update
      ansible.builtin.assert:
        that:
          - nomad_user_ttl_change_approved | default(false) | bool
          - nomad_user_ttl_server_limit_confirmed_720h | default(false) | bool
          - not ansible_check_mode
    - name: Update only the existing method TTL using partial API through protected operator CLI
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - '{{ lookup("ansible.builtin.file", playbook_dir + "/nomad-user-session-ttl.py") }}'
          - --cli
          - '{{ nomad_user_ttl_operator_cli }}'
          - --method
          - '{{ nomad_user_ttl_method }}'
          - --ttl
          - 720h
          - --backup-dir
          - '{{ nomad_user_ttl_backup_dir }}'
      no_log: true
      register: oidc_ttl_result
      changed_when: (oidc_ttl_result.stdout | from_json).changed
    - name: Read back only nonsecret lifetime settings
      ansible.builtin.debug:
        msg: '{{ oidc_ttl_result.stdout | from_json }}'
