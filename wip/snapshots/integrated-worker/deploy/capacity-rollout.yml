---
- name: Update only capacity telemetry binary on an empty Linux node
  hosts: lima_canary
  gather_facts: false
  become: true
  tasks:
    - ansible.builtin.assert:
        that:
          - capacity_rollout_approved | default(false) | bool
          - not ansible_check_mode
    - ansible.builtin.stat:
        path: '{{ capacity_source }}'
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      register: capacity_local
    - ansible.builtin.assert:
        that: capacity_local.stat.checksum == capacity_runtime.new_sha256
    - ansible.builtin.stat:
        path: '{{ capacity_runtime.binary }}'
        checksum_algorithm: sha256
      register: capacity_installed
    - name: Fresh read-only server guard before any scheduling change
      ansible.builtin.command:
        argv: '{{ capacity_operator_ssh + ["python3", "-", capacity_operator_cli, capacity_node_id, "read"] }}'
        stdin: '{{ lookup("ansible.builtin.file", playbook_dir + "/capacity-node-guard.py") }}'
      delegate_to: localhost
      become: false
      changed_when: false
      register: capacity_node_before
      when: capacity_installed.stat.checksum != capacity_runtime.new_sha256
    - ansible.builtin.assert:
        that:
          - (capacity_node_before.stdout | from_json).status == 'ready'
          - (capacity_node_before.stdout | from_json).eligibility == 'eligible'
          - (capacity_node_before.stdout | from_json).active_allocations | length == 0
      when: capacity_installed.stat.checksum != capacity_runtime.new_sha256
    - name: Guard and replace with scheduler exclusion, never drain/stop VMs
      when: capacity_installed.stat.checksum != capacity_runtime.new_sha256
      block:
        - name: Exclude only this empty node from new scheduling and read fresh allocations
          ansible.builtin.command:
            argv: '{{ capacity_operator_ssh + ["python3", "-", capacity_operator_cli, capacity_node_id, "disable"] }}'
            stdin: '{{ lookup("ansible.builtin.file", playbook_dir + "/capacity-node-guard.py") }}'
          delegate_to: localhost
          become: false
        - name: Verify no local VM/process and exact unchanged configuration
          ansible.builtin.command:
            argv: [python3, -c, '{{ lookup("ansible.builtin.file", playbook_dir + "/capacity-runtime-guard.py") }}', '{{ capacity_runtime | to_json }}']
          changed_when: false
        - name: Validate existing Nomad configuration with native CLI
          ansible.builtin.command:
            argv: ['{{ capacity_nomad }}', config, validate, '{{ capacity_runtime.config }}']
          changed_when: false
          no_log: true
        - name: Backup exact existing config without modifying it
          ansible.builtin.copy:
            src: '{{ capacity_runtime.config }}'
            remote_src: true
            dest: '{{ capacity_config_backup }}'
            mode: '0600'
            force: false
          no_log: true
        - name: Install only pinned driver binary with rollback backup
          ansible.builtin.copy:
            src: '{{ capacity_source }}'
            dest: '{{ capacity_runtime.binary }}'
            owner: root
            group: root
            mode: '0755'
            backup: true
          register: capacity_copy
        - name: Restart only empty Linux Nomad client
          ansible.builtin.systemd_service:
            name: nomad-client.service
            state: restarted
      always:
        - name: Restore only this node's scheduling eligibility
          ansible.builtin.command:
            argv: '{{ capacity_operator_ssh + ["python3", "-", capacity_operator_cli, capacity_node_id, "enable"] }}'
            stdin: '{{ lookup("ansible.builtin.file", playbook_dir + "/capacity-node-guard.py") }}'
          delegate_to: localhost
          become: false
          changed_when: false
    - ansible.builtin.stat:
        path: '{{ capacity_runtime.binary }}'
        checksum_algorithm: sha256
      register: capacity_final
    - ansible.builtin.assert:
        that: capacity_final.stat.checksum == capacity_runtime.new_sha256
    - ansible.builtin.debug:
        msg:
          - 'Installed driver SHA256: {{ capacity_final.stat.checksum }}'
          - 'Rollback binary: {{ capacity_copy.backup_file | default("unchanged") }}'
          - 'Client config unchanged; no VM/model launched; Mac untouched.'
