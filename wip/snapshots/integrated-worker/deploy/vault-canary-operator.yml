---
- name: Stage lightweight no-model coordinator with existing operator identity kept local
  hosts: nomad_operator
  gather_facts: false
  tasks:
    - name: Create dedicated private canary directory
      ansible.builtin.file:
        path: /root/agent-v2-accept
        state: directory
        mode: '0700'
    - name: Stage only official CLI and public coordinator assets
      ansible.builtin.copy:
        src: '{{ item.src }}'
        dest: '/root/agent-v2-accept/{{ item.name }}'
        mode: '{{ item.mode }}'
      loop:
        - {src: /tmp/agent-base-v2/operator-cli/nomad, name: nomad, mode: '0755'}
        - {src: nomad-operator-cli.py, name: nomad-operator, mode: '0700'}
        - {src: ../plugin/scripts/workerctl.py, name: workerctl.py, mode: '0600'}
        - {src: ../plugin/scripts/catalog_cli.py, name: catalog_cli.py, mode: '0600'}
        - {src: ../plugin/scripts/lease.py, name: lease.py, mode: '0600'}
        - {src: ../plugin/scripts/diagnostics.py, name: diagnostics.py, mode: '0600'}
        - {src: ../plugin/scripts/secure_logs.py, name: secure_logs.py, mode: '0600'}
        - {src: '{{ operator_artifact_root | default("/tmp/agent-base-v2") }}/catalog.json' , name: catalog.json, mode: '0600'}
        - {src: '{{ operator_artifact_root | default("/tmp/agent-base-v2") }}/no-model/config.json' , name: config.json, mode: '0600'}
        - {src: '{{ operator_artifact_root | default("/tmp/agent-base-v2") }}/no-model/identity.json' , name: identity.json, mode: '0600'}
        - {src: vault-no-model.py, name: vault-no-model.py, mode: '0600'}
    - name: Verify official CLI starts without invoking any job or model
      ansible.builtin.command:
        argv: [/root/agent-v2-accept/nomad, version]
      changed_when: false
