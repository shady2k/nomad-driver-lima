---
- name: Bind approved scoped results access to the existing native caller
  hosts: nomad_caller
  gather_facts: false
  become: true
  become_user: dev
  tasks:
    - name: Require exact approved no-secret reference configuration
      ansible.builtin.assert:
        that:
          - results_caller_approved | default(false) | bool
          - results_caller_spec is mapping
          - not ansible_check_mode
    - name: Install reference, preserve original client config, and verify native adapter access
      ansible.builtin.command:
        argv:
          - /run/current-system/sw/bin/python3
          - -c
          - '{{ lookup("ansible.builtin.file", playbook_dir + "/results-s3-caller.py") }}'
          - '{{ results_caller_spec | to_json }}'
      no_log: true
      register: caller_results
      changed_when: caller_results.rc == 0 and (caller_results.stdout | from_json).changed
    - name: Report nonsecret native caller proof
      ansible.builtin.debug:
        msg: '{{ caller_results.stdout | from_json }}'
