---
- name: Reconcile neutral Linux service descriptions without restarting services
  hosts: lima_canary
  gather_facts: false
  become: true
  vars:
    neutral_service_labels:
      - {unit: nomad-client.service, description: Nomad agent client}
      - {unit: boxlite-bao-agent.service, description: Runtime secrets agent}
  tasks:
    - name: Record service PIDs before cosmetic-only metadata change
      ansible.builtin.command:
        argv: [systemctl, show, '{{ item.unit }}', '--property=MainPID', --value]
      loop: '{{ neutral_service_labels }}'
      register: service_pids_before
      changed_when: false
    - name: Replace only existing Description directives with neutral labels
      ansible.builtin.lineinfile:
        path: '/etc/systemd/system/{{ item.unit }}'
        regexp: '^Description='
        line: 'Description={{ item.description }}'
        backup: true
      loop: '{{ neutral_service_labels }}'
      no_log: true
      register: service_labels_result
    - name: Reload systemd metadata only when description changed
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: service_labels_result.changed
    - name: Read service PIDs after metadata reload
      ansible.builtin.command:
        argv: [systemctl, show, '{{ item.unit }}', '--property=MainPID', --value]
      loop: '{{ neutral_service_labels }}'
      register: service_pids_after
      changed_when: false
    - name: Verify no process restart occurred
      ansible.builtin.assert:
        that: service_pids_before.results | map(attribute='stdout') | list == service_pids_after.results | map(attribute='stdout') | list
