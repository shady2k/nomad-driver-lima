---
- name: Reconcile only the explicitly approved existing agent policy delta
  hosts: nomad_operator
  gather_facts: false
  tasks:
    - name: Require exact before digest and existing operator/coordinator auth references
      ansible.builtin.assert:
        that:
          - acl_expected_before_sha256 is match('^[a-f0-9]{64}$')
          - acl_backup_dir is match('^/')
    - name: Reconcile policy using only operator-side existing credentials
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/acl-state.py') }}"
          - '{{ lima_operator_api }}'
          - '{{ lima_operator_token_file }}'
          - '{{ acl_coordinator_token_file }}'
          - '{{ acl_expected_before_sha256 }}'
          - '{{ acl_backup_dir }}'
          - "{{ 'check' if ansible_check_mode else 'apply' }}"
      check_mode: false
      no_log: true
      register: acl_result
      changed_when: (acl_result.stdout | from_json).changed
    - name: Report only nonsecret policy and access readback
      ansible.builtin.debug:
        msg: '{{ acl_result.stdout | from_json }}'
