---
- name: Update only frozen caller plugin release, preserving private configuration
  hosts: nomad_caller
  gather_facts: false
  tasks:
    - ansible.builtin.assert:
        that:
          - caller_install_approved | default(false) | bool
          - caller_release is match('^[a-f0-9]{40}$')
          - caller_archive_sha256 is match('^[a-f0-9]{64}$')
          - caller_plugin_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
          - caller_release_root == caller_home + '/.local/share/claude-plugins/nomad-workers/releases/' + caller_release
          - not ansible_check_mode
    - ansible.builtin.stat:
        path: '{{ caller_archive }}'
        checksum_algorithm: sha256
      delegate_to: localhost
      register: frozen_archive
    - ansible.builtin.assert:
        that: frozen_archive.stat.checksum == caller_archive_sha256
    - ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        owner: '{{ caller_user }}'
        group: '{{ caller_group }}'
        mode: '0700'
      loop: ['{{ caller_release_root }}', '{{ caller_release_root }}/.claude-plugin']
    - ansible.builtin.unarchive:
        src: '{{ caller_archive }}'
        dest: '{{ caller_release_root }}'
        owner: '{{ caller_user }}'
        group: '{{ caller_group }}'
        creates: '{{ caller_release_root }}/plugin/.claude-plugin/plugin.json'
    - ansible.builtin.copy:
        content: '{{ caller_marketplace | to_nice_json }}'
        dest: '{{ caller_release_root }}/.claude-plugin/marketplace.json'
        owner: '{{ caller_user }}'
        group: '{{ caller_group }}'
        mode: '0600'
    - name: Validate frozen source through native Claude CLI
      ansible.builtin.command:
        argv: ['{{ caller_claude }}', plugin, validate, '{{ caller_release_root }}']
      become: true
      become_user: '{{ caller_user }}'
      environment: {HOME: '{{ caller_home }}', PATH: '{{ caller_path }}'}
      changed_when: false
    - ansible.builtin.stat:
        path: '{{ caller_home }}/.claude/plugins/cache/nomad-workers-local/nomad-workers/{{ caller_plugin_version }}/.claude-plugin/plugin.json'
      register: new_caller_cache
    - name: Nondestructively repoint and update through supported native CLI
      ansible.builtin.command:
        argv: ['{{ caller_python }}', '-c', '{{ lookup("ansible.builtin.file", playbook_dir + "/caller_safe_update.py") }}', '{{ caller_home }}', '{{ caller_claude }}', '{{ caller_release_root }}', '{{ caller_plugin_version }}']
      become: true
      become_user: '{{ caller_user }}'
      environment: {HOME: '{{ caller_home }}', PATH: '{{ caller_path }}'}
      register: caller_native_updated
      changed_when: (caller_native_updated.stdout | from_json).changed
    - name: Install nonsecret operations policy once, preserving operator overrides
      ansible.builtin.copy:
        content: '{{ caller_operations_policy | default(lookup("ansible.builtin.file", playbook_dir + "/../config.operations.example.json") | from_json) | to_nice_json }}'
        dest: '{{ caller_home }}/.config/nomad-workers/operations.json'
        owner: '{{ caller_user }}'
        group: '{{ caller_group }}'
        mode: '0600'
        force: false
    - name: Update CLI implementation only, retaining existing identity/config references
      ansible.builtin.copy:
        content: |
          #!/bin/sh
          exec {{ caller_python | quote }} {{ (caller_release_root + '/plugin/scripts/workerctl.py') | quote }} --config {{ (caller_home + '/.config/nomad-workers/catalog-client.json') | quote }} --operations-config {{ (caller_home + '/.config/nomad-workers/operations.json') | quote }} --discovery-config {{ (caller_home + '/.config/nomad-workers/catalog-client.json') | quote }} "$@"
        dest: '{{ caller_home }}/.local/bin/nomad-workers'
        owner: '{{ caller_user }}'
        group: '{{ caller_group }}'
        mode: '0755'
    - name: Verify installed release and read-only caller capacity/templates
      ansible.builtin.command:
        argv: ['{{ caller_python }}', '-c', '{{ lookup("ansible.builtin.file", playbook_dir + "/caller_verify.py") }}', '{{ caller_home }}', '{{ caller_claude }}', '{{ caller_release_root }}']
      become: true
      become_user: '{{ caller_user }}'
      environment: {HOME: '{{ caller_home }}', PATH: '{{ caller_path }}'}
      changed_when: false
      register: caller_release_verified
    - ansible.builtin.debug:
        msg: '{{ caller_release_verified.stdout | from_json }}'
