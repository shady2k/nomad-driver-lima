---
- name: Install one frozen caller plugin with existing identity references
  hosts: nomad_caller
  gather_facts: false
  tasks:
    - name: Require approved exact caller installation inputs
      ansible.builtin.assert:
        that:
          - caller_install_approved | default(false) | bool
          - caller_release is match('^[a-f0-9]{40}$')
          - caller_archive_sha256 is match('^[a-f0-9]{64}$')
          - caller_home is match('^/home/[a-z_][a-z0-9_-]*$')
          - caller_client_config.guest.model == None
          - caller_client_config.namespace == 'agent-workers'
          - caller_release_root == caller_home + '/.local/share/claude-plugins/nomad-workers/releases/' + caller_release
          - caller_client_config.nomad_bin == caller_home + '/.local/bin/nomad-workers-native'
          - caller_auth_config.token_file == caller_existing_token_reference
          - not ansible_check_mode
    - name: Verify local frozen package integrity
      ansible.builtin.stat:
        path: '{{ caller_archive }}'
        checksum_algorithm: sha256
      delegate_to: localhost
      register: caller_package
    - ansible.builtin.assert:
        that: caller_package.stat.checksum == caller_archive_sha256
    - name: Create only the new plugin-specific private directories
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        owner: '{{ caller_user }}'
        group: '{{ caller_group }}'
        mode: '0700'
      loop:
        - '{{ caller_home }}/.local/share/claude-plugins/nomad-workers'
        - '{{ caller_home }}/.local/share/claude-plugins/nomad-workers/releases'
        - '{{ caller_release_root }}'
        - '{{ caller_release_root }}/.claude-plugin'
        - '{{ caller_home }}/.local/share/claude-plugins/nomad-workers/dependencies'
        - '{{ caller_home }}/.config/nomad-workers'
        - '{{ caller_home }}/.local/state/nomad-workers'
        - '{{ caller_home }}/.local/state/nomad-workers/results'
    - name: Verify the existing tested native Nomad dependency (not an auth wrapper)
      ansible.builtin.stat:
        path: '{{ caller_existing_nomad_source }}'
        checksum_algorithm: sha256
      register: caller_native_source
    - ansible.builtin.assert:
        that: caller_native_source.stat.checksum == caller_native_nomad_sha256
    - name: Install that same native dependency locally without downloads
      ansible.builtin.copy:
        src: '{{ caller_existing_nomad_source }}'
        remote_src: true
        dest: '{{ caller_auth_config.nomad_binary }}'
        owner: '{{ caller_user }}'
        group: '{{ caller_group }}'
        mode: '0555'
    - name: Materialize this immutable source release without changing old caches
      ansible.builtin.unarchive:
        src: '{{ caller_archive }}'
        dest: '{{ caller_release_root }}'
        owner: '{{ caller_user }}'
        group: '{{ caller_group }}'
        creates: '{{ caller_release_root }}/plugin/.claude-plugin/plugin.json'
    - name: Add the native local marketplace manifest
      ansible.builtin.copy:
        content: '{{ caller_marketplace | to_nice_json }}'
        dest: '{{ caller_release_root }}/.claude-plugin/marketplace.json'
        owner: '{{ caller_user }}'
        group: '{{ caller_group }}'
        mode: '0600'
    - name: Install nonsecret approved config and catalog only
      ansible.builtin.copy:
        content: '{{ item.content }}'
        dest: '{{ caller_home }}/.config/nomad-workers/{{ item.name }}'
        owner: '{{ caller_user }}'
        group: '{{ caller_group }}'
        mode: '0600'
      loop:
        - {name: catalog-client.json, content: '{{ caller_client_config | to_nice_json }}'}
        - {name: nomad-cli.json, content: '{{ caller_auth_config | to_nice_json }}'}
        - {name: catalog.json, content: '{{ lookup("ansible.builtin.file", caller_catalog_source, rstrip=False) }}'}
      no_log: true
    - name: Install explicit config CLI entrypoints as part of the plugin
      ansible.builtin.copy:
        content: |
          #!/bin/sh
          exec {{ caller_python | quote }} {{ (caller_release_root + '/plugin/scripts/' + item.script) | quote }} --config {{ (caller_home + '/.config/nomad-workers/' + item.config) | quote }} {{ item.separator }} "$@"
        dest: '{{ caller_home }}/.local/bin/{{ item.name }}'
        owner: '{{ caller_user }}'
        group: '{{ caller_group }}'
        mode: '0755'
      loop:
        - {name: nomad-workers, script: workerctl.py, config: catalog-client.json, separator: ''}
        - {name: nomad-workers-native, script: nomad_cli.py, config: nomad-cli.json, separator: '--'}
    - name: Validate the native plugin package before registration
      ansible.builtin.command:
        argv: ['{{ caller_claude }}', plugin, validate, '{{ caller_release_root }}']
      become: true
      become_user: '{{ caller_user }}'
      environment: {HOME: '{{ caller_home }}', PATH: '{{ caller_path }}'}
      changed_when: false
    - name: Read existing native plugin registration without credentials
      ansible.builtin.stat:
        path: '{{ caller_home }}/.claude/plugins/cache/nomad-workers-local/nomad-workers/0.1.0/.claude-plugin/plugin.json'
      register: caller_registered
    - name: Install from this local marketplace using native Claude CLI
      ansible.builtin.command:
        argv: ['{{ caller_claude }}', plugin, install, nomad-workers, --marketplace, '{{ caller_release_root }}', --scope, user, --json]
      become: true
      become_user: '{{ caller_user }}'
      environment: {HOME: '{{ caller_home }}', PATH: '{{ caller_path }}'}
      when: not caller_registered.stat.exists
      no_log: true
    - name: Verify native plugin registration and read-only caller interface
      ansible.builtin.command:
        argv: ['{{ caller_python }}', '-c', '{{ lookup("ansible.builtin.file", playbook_dir + "/caller_verify.py") }}', '{{ caller_home }}', '{{ caller_claude }}', '{{ caller_release_root }}']
      become: true
      become_user: '{{ caller_user }}'
      environment: {HOME: '{{ caller_home }}', PATH: '{{ caller_path }}'}
      changed_when: false
      register: caller_verified
    - ansible.builtin.debug:
        msg: '{{ caller_verified.stdout | from_json }}'
