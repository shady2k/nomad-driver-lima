---
- name: Recover exactly one proven absent create using existing two-host authorization
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Verify the tested one-shot controller source
      ansible.builtin.stat:
        path: '{{ playbook_dir }}/../tools/recover-failed-create.py'
        checksum_algorithm: sha256
      register: recovery_controller
    - name: Require pinned controller and explicit exact target
      ansible.builtin.assert:
        that:
          - recovery_controller.stat.checksum == recovery_controller_sha256
          - recovery_key is match('^[a-f0-9]{64}$')
          - recovery_namespace == 'agent-workers'
          - recovery_apply_confirmed | bool
          - not ansible_check_mode
    - name: Execute addressed recovery without VM creation or credential transfer
      ansible.builtin.command:
        argv:
          - '{{ recovery_python }}'
          - '{{ playbook_dir }}/../tools/recover-failed-create.py'
          - --runtime-host
          - '{{ recovery_runtime_host }}'
          - --operator-host
          - '{{ recovery_operator_host }}'
          - --ssh-identity
          - '{{ recovery_ssh_identity }}'
          - --ssh-config
          - '{{ recovery_ssh_config }}'
          - --runtime-sudo
          - --driver
          - '{{ recovery_driver }}'
          - --state-dir
          - '{{ recovery_state_dir }}'
          - --lima-home
          - '{{ recovery_lima_home }}'
          - --runtime-user
          - '{{ recovery_runtime_user }}'
          - --limactl
          - '{{ recovery_limactl }}'
          - --key
          - '{{ recovery_key }}'
          - --allocation
          - '{{ recovery_allocation }}'
          - --node
          - '{{ recovery_node }}'
          - --job
          - '{{ recovery_job }}'
          - --namespace
          - '{{ recovery_namespace }}'
          - --failure-log
          - '{{ recovery_failure_log }}'
          - --operator-cli
          - '{{ recovery_operator_cli }}'
          - --operator-python
          - '{{ recovery_operator_python }}'
      register: recovery_result
      changed_when: recovery_result.rc == 0 and not (recovery_result.stdout | from_json).already_recovered
    - name: Report only the durable nonsecret recovery result
      ansible.builtin.debug:
        msg: '{{ recovery_result.stdout | from_json }}'
