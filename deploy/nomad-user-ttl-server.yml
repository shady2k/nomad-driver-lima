---
- name: Reconcile explicitly approved server user ACL expiration cap
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ansible.builtin.assert:
        that:
          - nomad_user_ttl_server_change_approved | default(false) | bool
          - not ansible_check_mode
    - name: Read exact before settings for backup and CAS
      ansible.builtin.command:
        argv: [python3, -c, "import json\nTTL_SERVER_MODE='inspect'\nTTL_SERVER_CONFIG=json.loads({{ nomad_user_ttl_server_config | to_json | to_json }})\n{{ lookup('ansible.builtin.file', playbook_dir + '/nomad-user-ttl-server.py') }}"]
      no_log: true
      register: ttl_server_before
      changed_when: false
    - ansible.builtin.set_fact:
        ttl_before: "{{ (ttl_server_before.stdout_lines | select('match','^TTL_SERVER_BEFORE:') | first | regex_replace('^TTL_SERVER_BEFORE:','')) | from_json }}"
      no_log: true
    - ansible.builtin.file:
        path: '{{ nomad_user_ttl_server_backup | dirname }}'
        state: directory
        mode: '0700'
    - name: Save selected config backup without tokens or provider secrets
      ansible.builtin.copy:
        content: '{{ ttl_before | to_nice_json }}'
        dest: '{{ nomad_user_ttl_server_backup }}'
        force: false
        mode: '0600'
      no_log: true
    - name: Change only ACL expiration bound and restart only server by config hash
      ansible.builtin.command:
        argv: [python3, -c, "import json,hashlib\nTTL_SERVER_MODE='apply'\nEXPECTED_SERVER_GUARD={{ ttl_before.guard_sha256 | to_json }}\nTTL_SERVER_CONFIG=json.loads({{ nomad_user_ttl_server_config | to_json | to_json }})\n{{ lookup('ansible.builtin.file', playbook_dir + '/nomad-user-ttl-server.py') }}"]
      no_log: true
      register: ttl_server_result
      changed_when: >-
        ttl_server_result.rc == 0 and '"changed": true' in ttl_server_result.stdout
    - name: Wait for the existing server StatefulSet rollout
      ansible.builtin.command:
        argv: [/opt/homebrew/bin/kubectl, -n, '{{ nomad_user_ttl_server_config.namespace }}', rollout, status, 'statefulset/{{ nomad_user_ttl_server_config.statefulset }}', --timeout=180s]
      changed_when: false
      register: ttl_rollout
    - ansible.builtin.debug:
        msg: "{{ ttl_server_result.stdout_lines | select('match','^TTL_SERVER_RESULT:') | list }}"
