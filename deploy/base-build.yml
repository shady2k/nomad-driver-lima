---
- name: Prepare one clean versioned native boot-image builder (no production restart)
  hosts: "{{ base_hosts | default('lima_canary') }}"
  gather_facts: false
  become: "{{ base_become | default(true) }}"
  tasks:
    - name: Require explicit isolated builder and pinned recipe
      ansible.builtin.assert:
        that:
          - base_builder_name is match('^agent-base-build-[a-z0-9-]+$')
          - base_lima_home != lima_home
          - base_build_root is match('^/')
          - base_start_authorized | default(false) | bool
          - base_architecture | default('amd64') in ['amd64', 'arm64']
          - base_vm_type | default('qemu') in ['qemu', 'vz']
          - base_vm_type | default('qemu') != 'vz' or (base_architecture == 'arm64' and base_runtime_home is defined)
          - base_recipe_sha256 is match('^[a-f0-9]{64}$')
    - name: Read-only Mac physical capacity guard before any builder creation
      ansible.builtin.command:
        argv: ['{{ base_host_python | default("/usr/bin/python3") }}', -c, '{{ lookup("ansible.builtin.file", playbook_dir + "/base-mac-preflight.py") }}', --path, '{{ base_runtime_home }}', --disk-gib, '{{ base_disk_gib | default(8) | string }}', --memory-mib, '{{ base_acceptance_memory_mib | default(2048) | string }}']
      changed_when: false
      when: base_vm_type | default('qemu') == 'vz'
    - name: Create private isolated builder and artifact directories
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        owner: '{{ lima_runtime_user }}'
        group: '{{ base_runtime_group | default(lima_runtime_user) }}'
        mode: '0700'
      loop: ['{{ base_lima_home }}', '{{ base_build_root }}']
    - name: Copy reviewed builder recipe
      ansible.builtin.copy:
        src: '{{ base_recipe_source | default(playbook_dir + "/../templates/agent-base.yaml") }}'
        dest: '{{ base_build_root }}/builder.yaml'
        owner: '{{ lima_runtime_user }}'
        group: '{{ base_runtime_group | default(lima_runtime_user) }}'
        mode: '0600'
        force: false
    - name: Verify exact staged recipe
      ansible.builtin.stat:
        path: '{{ base_build_root }}/builder.yaml'
        checksum_algorithm: sha256
      register: base_recipe_stat
    - name: Refuse mutation of an already selected builder recipe
      ansible.builtin.assert:
        that: base_recipe_stat.stat.checksum == base_recipe_sha256
    - name: Create the new clean builder using only upstream Lima
      ansible.builtin.command:
        argv: [/usr/bin/env, -i, 'HOME={{ base_runtime_home | default("/home/" + lima_runtime_user) }}', 'PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin', 'LIMA_HOME={{ base_lima_home }}', '{{ lima_limactl }}', create, '--tty=false', '--name={{ base_builder_name }}', '--vm-type={{ base_vm_type | default("qemu") }}', '--arch={{ "aarch64" if base_architecture | default("amd64") == "arm64" else "x86_64" }}', '{{ base_build_root }}/builder.yaml']
        creates: '{{ base_lima_home }}/{{ base_builder_name }}/lima.yaml'
      become_user: '{{ lima_runtime_user }}'
    - name: Inspect durable build launch receipt
      ansible.builtin.stat:
        path: '{{ base_build_root }}/prepare-operation.json'
      register: base_operation
    - name: Start one-time native preparation asynchronously with visible upstream progress
      ansible.builtin.shell: >-
        {{ ([ '/usr/bin/env', '-i', 'HOME=' + (base_runtime_home | default('/home/' + lima_runtime_user)), 'PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin', 'LIMA_HOME=' + base_lima_home, lima_limactl, 'start', '--tty=false', '--progress', '--timeout=45m', base_builder_name ] | map('quote') | join(' ')) }}
        > {{ (base_build_root + '/builder-start.log') | quote }} 2>&1
      become_user: '{{ lima_runtime_user }}'
      async: 3600
      poll: 0
      register: base_start_job
      when: base_start_authorized | bool and not base_operation.stat.exists
    - name: Record nonsecret creator/session and async operation receipt
      ansible.builtin.copy:
        content: '{{ {"builder":base_builder_name,"lima_home":base_lima_home,"recipe_sha256":base_recipe_sha256,"creator":base_creator,"session_id":base_session_id,"async":base_start_job} | to_nice_json }}'
        dest: '{{ base_build_root }}/prepare-operation.json'
        owner: '{{ lima_runtime_user }}'
        group: '{{ base_runtime_group | default(lima_runtime_user) }}'
        mode: '0600'
      when: base_start_authorized | bool and not base_operation.stat.exists
