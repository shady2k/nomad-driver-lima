---
# The Mac (arm64, Apple Virtualization). The same two roles as a Linux node: the
# difference is the service - a launchd LaunchDaemon instead of a systemd unit -
# and the hypervisor (vz instead of qemu).

box_runtime_user: dev
box_limactl: /opt/homebrew/bin/limactl
# Apple Virtualization: no qemu on this node.
box_vm_type: vz

nomad_node_name: '{{ inventory_hostname }}'
nomad_data_dir: /opt/nomad/data
nomad_bind_addr: '0.0.0.0'
nomad_advertise_addr: '{{ ansible_facts.default_ipv4.address }}'
nomad_meta:
  box: 'true'
  vm_type: vz

# The CPU this Mac offers. Nomad 2.0.7 fingerprinted a 14-core M4 as 48 MHz of
# total CPU, and with the default reservation the node then offered no CPU at all:
# nothing could be placed on it. Nomad cannot read the real clock of the machine,
# so declare what you want to sell. Pick the number yourself: cores x a per-core
# MHz you are willing to offer (a share of the core, not its peak).
# nomad_client_extra:
#   cpu_total_compute: 7000        # 14 cores x 500 MHz

# The launchd daemon: written to /Library/LaunchDaemons/com.hashicorp.nomad.plist
# and loaded by the play. Set nomad_launchd_load: false to stage the plist and load
# it yourself - that is what the kit's own checks do on a Linux host.
# nomad_launchd_load: true
# A restart that keeps the boxes (AbandonProcessGroup=true):
#   sudo launchctl kickstart -k system/com.hashicorp.nomad
#
# The other scope - a LaunchAgent of the logged-in user, no root, started at login
# instead of at boot - is a profile rather than a group setting: see
# deploy/ansible/profiles/macos-user.yml and deploy/README.md.
