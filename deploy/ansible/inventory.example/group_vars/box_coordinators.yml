---
# The coordinator: the box CLI, the box skill, and the environment they read.

# The user that runs the agent and the CLI. The role does not create the user.
box_coordinator_user: root

# The Nomad API of the cluster. The CLI reads NOMAD_ADDR (and NOMAD_TOKEN,
# NOMAD_CACERT when the cluster uses ACLs or mTLS) from the environment file the
# role writes at ~/.config/box/env, mode 0600.
box_nomad_addr: https://nomad.example:4646
# box_nomad_token: '{{ vault_nomad_acl_token }}'
# box_nomad_cacert: /etc/nomad.d/tls/ca.pem

# The base image index the CLI reads (JSON: the versions published for boxes).
# There is no default: without this, `box create` and `box images` say the index is
# not configured. Point it at the index you publish (docs/guest-image.md) or
# at one you trust.
box_image_index: 'https://images.example.com/box-base/index.json'

# The Vault role a box reads its executor credentials with (BOX_VAULT_ROLE, the
# default of `box create --vault-role`). It must be the role whose policy reads
# the box paths, e.g. kv/data/box/*; deploy/README.md sets the Vault side up.
# Leave it empty for the cluster's default role.
box_vault_role: 'box-workloads'

# The CLI lives in the same release layout as the node plugins: the live release
# through /opt/box/current, and /usr/local/bin/box is a symlink into it.
# box_release_root: /opt/box
# box_cli_path: /usr/local/bin/box
