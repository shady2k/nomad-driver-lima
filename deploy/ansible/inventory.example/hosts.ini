# The inventory of the box platform: three groups, one file.
#
#   cp -r inventory.example inventory
#   $EDITOR inventory/hosts.ini inventory/group_vars/*.yml
#   cd deploy/ansible && ansible-playbook -i inventory site.yml --check
#
# Groups:
#   box_nodes         the Linux amd64 nodes that run boxes (a Nomad client + the box driver)
#   box_nodes_mac     the Mac (arm64, Apple Virtualization): the same two roles, and a
#                     launchd daemon instead of a systemd unit
#   box_coordinators  the host that gets the box CLI and the box skill
#
# A host in box_nodes or box_nodes_mac runs two roles in this order: box_node (the
# release, the driver and volume plugin binaries, the volume settings file, lima,
# qemu, the runtime user, the cgroup prerequisites) and nomad_client (the pinned
# Nomad binary, the whole client configuration, the service, the one restart). A
# coordinator runs box_coordinator only.
#
# The addresses below are documentation placeholders (RFC 5737, 192.0.2.0/24):
# replace them with your own. Every variable the roles read is documented in
# roles/*/defaults/main.yml; the group_vars files next to this file set the ones a
# real host must set.

[box_nodes]
node-01 ansible_host=192.0.2.11 ansible_user=root

[box_nodes_mac]
mac-01 ansible_host=192.0.2.21 ansible_user=dev

[box_coordinators]
coordinator-01 ansible_host=192.0.2.5 ansible_user=root
