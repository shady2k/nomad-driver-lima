# Ansible settings for the deploy kit. Run the playbooks from this directory
# (deploy/ansible), so playbook_dir is stable:
#
#   cd deploy/ansible
#   ansible-playbook -i /path/to/inventory site.yml --check
[defaults]
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = False
deprecation_warnings = False
nocows = True

[ssh_connection]
pipelining = True
