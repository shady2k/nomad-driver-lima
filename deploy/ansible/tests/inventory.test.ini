# A throwaway inventory for the deploy kit's own checks: a "node" and a
# "coordinator", both the machine that runs Ansible over a local connection. Used
# by tests/run-tests.sh only.
#
# Two hosts, not one, so that --limit selects a role group the way it does in a
# real inventory: `localhost` in both groups would let the coordinator play run
# against a node prefix.
#
# The roles are run with box_system_changes: false / nomad_system_changes: false and
# every path inside a temporary prefix, so nothing outside the worktree changes.
[box_nodes]
node-01 ansible_connection=local

[box_coordinators]
coordinator-01 ansible_connection=local
