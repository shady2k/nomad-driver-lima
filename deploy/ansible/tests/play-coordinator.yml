---
# The coordinator role against the machine that runs Ansible, into a throwaway
# prefix.
#
# This is the check `tests/run-tests.sh` runs: the same role site.yml uses, on one
# local host, with every path inside NOMAD_TEST_PREFIX, so no skill directory and
# no environment file of the real user is touched.
#
#   NOMAD_TEST_PREFIX=/tmp/x ansible-playbook -i tests/inventory.test.ini \
#     tests/play-coordinator.yml -e @tests/vars-test.yml
- name: The coordinator role, into a throwaway prefix
  hosts: box_coordinators
  become: false
  gather_facts: true
  roles:
    - role: box_coordinator
