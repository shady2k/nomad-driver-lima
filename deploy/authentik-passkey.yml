---
- name: Enable exactly approved passkey entry on existing common login
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Require explicit passkey approval and private backup path
      ansible.builtin.assert:
        that:
          - authentik_passkey_approved | default(false) | bool
          - authentik_passkey_backup_file is match('^/')
          - not ansible_check_mode
    - name: Read selected nonsecret settings before change
      ansible.builtin.command:
        argv: [/opt/homebrew/bin/kubectl, -n, authentik, exec, '{{ authentik_server_pod }}', --, ak, shell, --no-imports, -v, '0', -c, "import json\nPASSKEY_MODE='inspect'\nPASSKEY_CONFIG=json.loads({{ authentik_passkey_config | to_json | to_json }})\n{{ lookup('ansible.builtin.file', playbook_dir + '/authentik-passkey.py') }}"]
      no_log: true
      register: passkey_inspection
      changed_when: false
    - ansible.builtin.set_fact:
        passkey_before: "{{ (passkey_inspection.stdout_lines | select('match','^PASSKEY_SNAPSHOT:') | first | regex_replace('^PASSKEY_SNAPSHOT:','')) | from_json }}"
      no_log: true
    - name: Create private backup directory
      ansible.builtin.file:
        path: '{{ authentik_passkey_backup_file | dirname }}'
        state: directory
        mode: '0700'
    - name: Preserve original settings backup without credential data
      ansible.builtin.copy:
        content: '{{ passkey_before | to_nice_json }}'
        dest: '{{ authentik_passkey_backup_file }}'
        mode: '0600'
        force: false
      no_log: true
    - name: Apply only approved stage and Identification binding transactionally
      ansible.builtin.command:
        argv: [/opt/homebrew/bin/kubectl, -n, authentik, exec, '{{ authentik_server_pod }}', --, ak, shell, --no-imports, -v, '0', -c, "import json\nPASSKEY_MODE='apply'\nEXPECTED_GUARD={{ passkey_before.guard_sha256 | to_json }}\nPASSKEY_CONFIG=json.loads({{ authentik_passkey_config | to_json | to_json }})\n{{ lookup('ansible.builtin.file', playbook_dir + '/authentik-passkey.py') }}"]
      no_log: true
      register: passkey_result
      changed_when: >-
        passkey_result.rc == 0 and '"changed": true' in passkey_result.stdout
    - name: Report only approved authentication settings and preservation checks
      ansible.builtin.debug:
        msg: "{{ passkey_result.stdout_lines | select('match','^PASSKEY_RESULT:') | list }}"
